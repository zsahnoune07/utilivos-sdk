name: ci

on:
  push:
    paths:
      - 'utilivos-sdk/**'
  pull_request:
    paths:
      - 'utilivos-sdk/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utilivos-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/utilivos
